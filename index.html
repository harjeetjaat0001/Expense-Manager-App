<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Manager</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <div class="app-container">

    <!-- Header Section -->
    <header class="app-header">
      <h1><i class="fa-solid fa-wallet"></i> Expense Manager</h1>
    </header>

    <!-- Summary Bar -->
    <div class="summary-container card">
      <div class="summary-item income">
        <div class="icon-box"><i class="fa-solid fa-arrow-down"></i></div>
        <div>
          <h3>Total Income</h3>
          <p id="total-income">$0.00</p>
        </div>
      </div>

      <div class="summary-item expense">
        <div class="icon-box"><i class="fa-solid fa-arrow-up"></i></div>
        <div>
          <h3>Total Expenses</h3>
          <p id="total-expenses">$0.00</p>
        </div>
      </div>

      <div class="summary-item balance">
        <div class="icon-box"><i class="fa-solid fa-scale-balanced"></i></div>
        <div>
          <h3>Net Balance</h3>
          <p id="net-balance">$0.00</p>
        </div>
      </div>
    </div>

    <!-- Main Grid Container -->
    <div class="main-container">

      <!-- Left Column (Form + Chart) -->
      <div class="left-column">
        
        <!-- Add Transaction Form -->
        <div class="card">
          <h2><i class="fa-solid fa-plus-circle"></i> Add Transaction</h2>
          <form id="tx-form">
            <div class="form-row">
              <div class="form-group">
                <label for="desc">Description</label>
                <input type="text" placeholder="e.g. Groceries" id="desc" required>
              </div>
              <div class="form-group">
                <label for="amount">Amount ($)</label>
                <input type="number" id="amount" placeholder="0.00" step="0.01" required>
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="type">Type</label>
                <select id="type">
                  <option value="expense">Expense</option>
                  <option value="income">Income</option>
                </select>
              </div>
              <div class="form-group">
                <label for="category">Category</label>
                <select id="category">
                  <option value="food">Food</option>
                  <option value="transport">Transport</option>
                  <option value="fun">Fun</option>
                  <option value="others">Others</option>
                </select>
              </div>
            </div>
            
            <div class="form-group">
              <label for="date">Date</label>
              <input type="date" id="date" required>
            </div>
            
            <button type="submit" class="btn-primary">Add Transaction</button>
          </form>
        </div>

        <!-- Expenses by Category Chart -->
        <div class="card">
          <h2><i class="fa-solid fa-chart-pie"></i> Expenses by Category</h2>
          <div id="chart"></div>
        </div>

      </div>

      <!-- Right Column (Transaction History) -->
      <div class="right-column card">
        <div class="history-header">
          <h2><i class="fa-solid fa-list-check"></i> History</h2>
          <div class="filter-controls">
            <input type="month" id="filter-month">
            <select id="filter-category">
              <option value="all">All Categories</option>
              <option value="food">Food</option>
              <option value="transport">Transport</option>
              <option value="fun">Fun</option>
              <option value="others">Others</option>
            </select>
          </div>
        </div>

        <!-- Transaction List -->
        <ul id="tx-list"></ul>
      </div>

    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
